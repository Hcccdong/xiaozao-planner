name: 自动编译并发布 Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 自动构建 APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 JDK 17 编译环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Gradle 8.4 自动化构建引擎
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: 执行 Gradle 编译打包 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 复制并重命名安装包
        run: |
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/app-debug.apk output_apk/xiaozao-planner_v1.4.0.apk

      - name: 将 APK 上传至 GitHub Actions 供直接下载
        uses: actions/upload-artifact@v4
        with:
          name: xiaozao-planner_v1.4.0_安装包
          path: output_apk/xiaozao-planner_v1.4.0.apk

      - name: 自动同步至 Releases 附件
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.4.0
          files: output_apk/xiaozao-planner_v1.4.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
